# Project configuration. Weaviate settings can be overridden with the
# environment variables WEAVIATE_HOST, WEAVIATE_HTTP_PORT, WEAVIATE_GRPC_PORT.

[weaviate]
host = "localhost"
http_port = 8080
grpc_port = 50051

[dataset]
name = "arxiv-nomic-768-normalized"
url = "https://huggingface.co/datasets/vector-index-bench/vibe/resolve/main/arxiv-nomic-768-normalized.hdf5"
data_dir = "data"          # relative to the repository root

[collection]
name = "Arxiv"

[import]
batch_size = 1000          # objects per batch sent to Weaviate
read_chunk = 10000         # vectors read from HDF5 at once
