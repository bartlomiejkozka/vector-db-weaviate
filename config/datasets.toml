# Registry of the VIBE datasets listed in the Common Baseline.
#
# The registry is used for downloading (url, size, checksum) and for showing the
# resolved configuration before a file is downloaded. Once the file exists, the
# real row count, dimension, distance and point_type are always read from the
# HDF5 attributes and compared with the values below.
#
# sha256 = the LFS object id published by Hugging Face (x-linked-etag), which is
# the sha256 of the file. Sizes are in bytes.

base_url = "https://huggingface.co/datasets/vector-index-bench/vibe/resolve/main"

[datasets."glove-200-cosine"]
rows = 1192514
dim = 200
distance = "cosine"
bytes = 956427392
sha256 = "5c0c316db8dd6c2503ea842ba8dc698d1513aa89a6655cc0d4be35d47645f5e0"
baseline = "accept"

